name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0) — used when not tagging'
        required: false
        default: '1.0.0'

permissions:
  contents: write
  issues: write

env:
  WORKING_DIR: mobile

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
          yes | sdkmanager --licenses || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        id: apk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError"
            echo "kotlin.incremental=false"
            echo "android.ndkVersion=28.2.13676358"
          } >> android/gradle.properties

          set -o pipefail
          flutter build apk --release --split-per-abi --verbose 2>&1 | tee android-build.log

      - name: Publish Android error (public)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'mobile/android-build.log';
            let body = 'Android APK build failed.\n\n';
            if (fs.existsSync(path)) {
              const raw = fs.readFileSync(path, 'utf8');
              const tail = raw.slice(-12000);
              body += '```text\n' + tail + '\n```\n';
            } else {
              body += '_No android-build.log found._\n';
            }
            body += `\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI: Android APK failed (${context.runId})`,
              body
            });

      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: mobile/android-build.log

      - name: Build App Bundle
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/SmartFarm-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/SmartFarm-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/SmartFarm-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/SmartFarm.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile/dist/*

  build-ios:
    name: Build IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Install CocoaPods (if needed)
        run: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install --repo-update
          else
            echo "No Podfile — Swift Package Manager, skip pod install"
          fi

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          zip -r dist/SmartFarm-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: mobile/dist/SmartFarm-unsigned.ipa

  release:
    name: GitHub Release
    needs: [build-android, build-ios]
    if: always() && needs.build-android.result == 'success' && needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: release-assets

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version || '1.0.0' }}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Smart Farm ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
